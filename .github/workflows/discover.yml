# Scheduled jobs-feed discovery & liveness sweep.
#
# Drives the background refresh of the Jobs feed:
# - Discovery sweep: runs saved searches + target company boards, inserts new postings,
#   and pre-ranks them (internal endpoint: POST /internal/discovery/run).
# - Liveness sweep: checks job posting URLs for HTTP 404/410, marks dead jobs as expired,
#   and refreshes active listings (internal endpoint: POST /internal/liveness/run).
#
# Both endpoints are guarded by N8N_WEBHOOK_SECRET.
name: Discover jobs (scheduled sweep)

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch:
    inputs:
      sweep_type:
        description: 'Sweep type to trigger'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - discovery
          - liveness

permissions:
  contents: read

concurrency:
  group: discover-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Run discovery & liveness sweeps
    runs-on: ubuntu-latest
    steps:
      - name: Trigger discovery sweep
        if: ${{ github.event_name == 'schedule' || inputs.sweep_type == 'all' || inputs.sweep_type == 'discovery' }}
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${API_BASE_URL:-}" ] || [ -z "${N8N_WEBHOOK_SECRET:-}" ]; then
            echo "::notice::Skipping — set NEXT_PUBLIC_API_BASE_URL and N8N_WEBHOOK_SECRET to activate the scheduled jobs feed."
            exit 0
          fi

          url="${API_BASE_URL%/}/internal/discovery/run"
          echo "POST ${url}"

          response="$(curl -sS -X POST "${url}" \
            -H 'Content-Type: application/json' \
            -H "X-N8N-Webhook-Secret: ${N8N_WEBHOOK_SECRET}" \
            --retry 3 --retry-delay 5 --max-time 120 \
            -w '\n%{http_code}' \
            -d '{}')"

          body="$(printf '%s' "${response}" | sed '$d')"
          code="$(printf '%s' "${response}" | tail -n1)"

          echo "HTTP ${code}"
          echo "${body}"

          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Discovery sweep failed (HTTP ${code})." >&2
            exit 1
          fi

      - name: Trigger liveness sweep
        if: ${{ github.event_name == 'schedule' || inputs.sweep_type == 'all' || inputs.sweep_type == 'liveness' }}
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${API_BASE_URL:-}" ] || [ -z "${N8N_WEBHOOK_SECRET:-}" ]; then
            echo "::notice::Skipping — set NEXT_PUBLIC_API_BASE_URL and N8N_WEBHOOK_SECRET to activate liveness sweep."
            exit 0
          fi

          url="${API_BASE_URL%/}/internal/liveness/run"
          echo "POST ${url}"

          response="$(curl -sS -X POST "${url}" \
            -H 'Content-Type: application/json' \
            -H "X-N8N-Webhook-Secret: ${N8N_WEBHOOK_SECRET}" \
            --retry 3 --retry-delay 5 --max-time 120 \
            -w '\n%{http_code}' \
            -d '{}')"

          body="$(printf '%s' "${response}" | sed '$d')"
          code="$(printf '%s' "${response}" | tail -n1)"

          echo "HTTP ${code}"
          echo "${body}"

          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Liveness sweep failed (HTTP ${code})." >&2
            exit 1
          fi
