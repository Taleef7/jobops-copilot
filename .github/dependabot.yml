version: 2
# Grouped + monthly to keep the noise down: each ecosystem batches its minor/patch bumps
# into ONE PR per month. MAJOR bumps are intentionally left OUT of the groups so they
# arrive as individual PRs and get reviewed on their own (a major can break at runtime in
# ways CI doesn't exercise — e.g. a provider SDK).
updates:
  # Keep the SHA-pinned GitHub Actions fresh — Dependabot bumps the pin and its `# vN` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm workspaces (web + api) resolve from the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The runtime is Node 22, so its types stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Python agent service: security updates only. Its image builds from a full lock
  # (constraints.txt) that Dependabot can't keep consistent: its group PRs didn't resolve and
  # dropped the CPU torch build. The lock gets hand-made bumps, each checked to resolve, and
  # CI's pip-audit on the lock is the gate. A limit of 0 stops version-update PRs only.
  - package-ecosystem: pip
    directory: /services/agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
